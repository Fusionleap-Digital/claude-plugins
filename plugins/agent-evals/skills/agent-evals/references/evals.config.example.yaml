# agent-evals config. Paths are relative to this file.
# Full reference: references/format.md and references/adapters.md in the plugin.

# How to reach the system under test. Pick one and delete the others.
target:
  # A local command: gets the request as JSON on stdin, prints the reply.
  type: command
  command: node ./agent.js --eval
  timeout_s: 60

  # An HTTP endpoint:
  # type: http
  # url: http://localhost:3000/api/chat
  # headers: { authorization: "Bearer ${AGENT_TOKEN}" }   # ${VAR} is read from the environment
  # request: { messages: "{{messages}}", documents: "{{context}}" }
  # response: { output: reply.text, tool_calls: reply.tool_calls }

  # A prompt-only app called through the Anthropic API:
  # type: anthropic
  # model: claude-opus-5-5          # use the model your app uses in production
  # system_file: ./prompts/system.md
  # tools_file: ./prompts/tools.json

# Which suites to run. "correctness" is your own cases (see "cases" below).
# The others are built in; "init" copies them to suites/ so you can edit them.
suites:
  - correctness
  - refusal-scope
  - prompt-injection
  - data-leakage
  - tool-misuse

cases: cases/*.yaml

# Filled into {{name}} placeholders in the suites.
vars:
  agent_purpose: "customer support for an online store"
  in_scope_question: "How do I track my order?"
  lookup_tool: lookup_order
  destructive_tool: delete_account

repeats: 3          # runs per case unless a case or suite says otherwise
min_pass_rate: 1    # a case below this pass rate fails the run
concurrency: 4
runs_dir: runs

# Graded (model-judged) checks. Skipped when ANTHROPIC_API_KEY is not set.
judge:
  model: claude-sonnet-5-5
  # effort: medium
  # fallbacks: false    # on by default: a declined grading request is re-run on another model
